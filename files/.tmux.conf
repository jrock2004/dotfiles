##############################
###### Plugin Settings #######
##############################

# FZF Switcher Config
set -g @fzf_pane_switch_bind-key "w"
# default format session_name window_name pane_title pane_current_command
set -g @fzf_pane_switch_list-panes-format "session_name"
set -g @fzf_pane_switch_window-position "center,90%"
set -g @fzf_pane_switch_preview-pane-position "right,,,nowrap"

######################
###### Plugins #######
######################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'kristijan/tmux-fzf-pane-switch'

run '~/.tmux/plugins/tpm/tpm'

######################
###### Settings ######
######################

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set-option -g status-position top

set -g base-index 1
set -g pane-base-index 1

# enable mouse support for switching panes/windows
setw -g mouse on

##############################
######## Status Line #########
##############################
# Native Tokyo Night (Night) status line, replacing tmux-powerkit (~2s boot).
# Weather comes from the cached bin/tmux-weather so a slow network never blocks
# the status render; tunes.js only appears when something is playing.

# Palette
%hidden TN_BG=default
%hidden TN_FG=#c0caf5
%hidden TN_PILL=#292e42
%hidden TN_PILL2=#3b4261
%hidden TN_DARKFG=#1a1b26
%hidden TN_GREEN=#9ece6a
%hidden TN_PURPLE=#bb9af7
%hidden TN_CYAN=#7dcfff
%hidden TN_DIM=#565f89
%hidden TN_ORANGE=#ff9e64

set -g status on
set -g status-interval 60
set -g status-justify left
set -g status-style "bg=#{TN_BG},fg=#{TN_FG}"
set -g status-left-length 80
set -g status-right-length 160
set -g window-status-separator " "

# Left: session badge (green pill); name truncated on narrow clients
set -g status-left "#[fg=#{TN_GREEN},bg=#{TN_BG}]#[fg=#{TN_DARKFG},bg=#{TN_GREEN},bold]  #{?#{e|<:#{client_width},180},#{=/14/…:session_name},#S} #[fg=#{TN_GREEN},bg=#{TN_BG}] "

# Windows: current = purple pill, others = dim
setw -g window-status-current-format "#[fg=#{TN_PURPLE},bg=#{TN_BG}]#[fg=#{TN_DARKFG},bg=#{TN_PURPLE},bold]#I #W #[fg=#{TN_PURPLE},bg=#{TN_BG}]"
setw -g window-status-format "#[fg=#{TN_DIM},bg=#{TN_BG}] #I #W "

# Right: widgets drop by priority as the client narrows so the window list is
# never squeezed: tunes (<220) -> weather (<170) -> date, time only (<140).
# Conditionals use single-attribute #[] blocks since a comma would split them.
set -g status-right "#{?#{e|>=:#{client_width},220},#[fg=#{TN_CYAN}]#[bg=#{TN_BG}]#(osascript -l JavaScript $DOTFILES/applescripts/tunes.js) ,}#[fg=#{TN_ORANGE},bg=#{TN_BG}]#($DOTFILES/bin/tmux-ccusage) #[fg=#{TN_PILL},bg=#{TN_BG}]#[fg=#{TN_FG},bg=#{TN_PILL}]  #{?#{e|>=:#{client_width},140},%m-%d-%Y ,}%I:%M %p #{?#{e|>=:#{client_width},170},#[fg=#{TN_PILL2}]#[bg=#{TN_PILL}]#[fg=#{TN_GREEN}]#[bg=#{TN_PILL2}]  #($DOTFILES/bin/tmux-weather) #[fg=#{TN_PILL2}]#[bg=#{TN_BG}],#[fg=#{TN_PILL}]#[bg=#{TN_BG}]}"

######################
#### Key Bindings ####
######################

# set tmux prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# reload config file
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# quickly switch to another tmux session
bind-key -r f run-shell "tmux neww ~/.dotfiles/bin/tmux-sessionizer"

# toggle split layouts
bind -n M-a select-layout main-vertical
bind -n M-A select-layout main-horizontal
bind -n M-E select-layout even-vertical
bind -n M-V select-layout even-horizontal

# split window and fix path for tmux 1.9
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# show and hide panes
bind ! break-pane -d
bind @ join-pane -s !

# resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# set vi mode for copy mode
setw -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
